# pyproject.toml

[project]
name = "rag-builder-spd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.13",
    "pydantic-settings>=2.12",
    "psycopg[binary]>=3.3",
    "openai>=2.41",
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-distro==0.62b1",
    "opentelemetry-exporter-otlp==1.41.1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
    "opentelemetry-instrumentation-httpx==0.62b1",
    "opentelemetry-propagator-b3==1.41.1",
    "python-json-logger==2.0.4",
    "alembic>=1.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
