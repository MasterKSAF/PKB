[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; =============================================================================
; Auth Service  — port 8082
; =============================================================================
[program:auth]
command=uvicorn app.main:app --host 0.0.0.0 --port 8082 --no-access-log
directory=/app/backend/auth_service
user=root
autostart=true
autorestart=false
startretries=0
stopwaitsecs=5
stdout_logfile=/var/log/supervisor/auth.log
stderr_logfile=/var/log/supervisor/auth.err
environment=
    PYTHONDONTWRITEBYTECODE="1",
    PYTHONUNBUFFERED="1",
    LOG_LEVEL="INFO",
    DEFAULT_ADMIN_EMAIL="%(ENV_DEFAULT_ADMIN_EMAIL)s",
    DEFAULT_ADMIN_PASSWORD="%(ENV_DEFAULT_ADMIN_PASSWORD)s",
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",
    JWT_ALGORITHM="%(ENV_JWT_ALGORITHM)s",
    MAX_FAILED_ATTEMPTS="%(ENV_MAX_FAILED_ATTEMPTS)s",
    LOCKOUT_DURATION_SECONDS="%(ENV_LOCKOUT_DURATION_SECONDS)s",
    RATE_LIMIT_REQUESTS="%(ENV_RATE_LIMIT_REQUESTS)s",
    RATE_LIMIT_WINDOW_SECONDS="%(ENV_RATE_LIMIT_WINDOW_SECONDS)s"

; =============================================================================
; Gateway Mock  — port 8080 (по документации gateway:8080)
; =============================================================================
[program:gateway]
command=uvicorn gateway.main:app --host 0.0.0.0 --port 8080 --no-access-log
directory=/app/backend/gateway_service
user=root
autostart=true
autorestart=false
startretries=0
stopwaitsecs=5
stdout_logfile=/var/log/supervisor/gateway.log
stderr_logfile=/var/log/supervisor/gateway.err
environment=
    PYTHONDONTWRITEBYTECODE="1",
    PYTHONUNBUFFERED="1",
    LOG_LEVEL="INFO",
    PYTHONPATH="/app/backend/gateway_service:$PYTHONPATH",
    GATEWAY_MODE="real",
    GATEWAY_PORT="8080",
    AUTH_SERVICE_URL="http://127.0.0.1:8082",
    ORCHESTRATOR_SERVICE_URL="http://127.0.0.1:8081",
    QUERY_SERVICE_URL="http://127.0.0.1:8083",
    REGISTRY_SERVICE_URL="http://127.0.0.1:8084",
    ALLOW_ANONYMOUS="true",
    RATE_LIMIT_ENABLED="%(ENV_RATE_LIMIT_ENABLED)s"

