[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
childlogdir=/var/log/supervisor

; =============================================================================
; Auth Service  — port 8082
; =============================================================================
[program:auth]
command=uvicorn app.main:app --host 0.0.0.0 --port 8082 --no-access-log
directory=/app/backend/auth_service
user=root
autostart=true
autorestart=false
startretries=0
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/auth.log
stderr_logfile=/var/log/supervisor/auth.err
environment=
    PYTHONDONTWRITEBYTECODE="1",
    PYTHONUNBUFFERED="1"

; =============================================================================
; Gateway Mock  — port 8081
; =============================================================================
[program:gateway]
command=uvicorn gateway:app --host 0.0.0.0 --port 8081 --no-access-log
directory=/app/backend/gateway_service/mocks
user=root
autostart=true
autorestart=false
startretries=0
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/gateway.log
stderr_logfile=/var/log/supervisor/gateway.err
environment=
    PYTHONDONTWRITEBYTECODE="1",
    PYTHONUNBUFFERED="1",
    PYTHONPATH="/app/backend/gateway_service:$PYTHONPATH"

