    PYTHONPATH="/app/backend/rag_builder_service/src:$PYTHONPATH",
    EMBEDDING_PROVIDER="tei",
    EMBEDDING_BASE_URL="http://127.0.0.1:8092",
    EMBEDDING_MODEL="Vuy/rubert-tiny2-onnx",
    EMBEDDING_DIM="312"

