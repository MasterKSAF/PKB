# =============================================================================
# PKB Neuroassistant — единый Docker Compose (корень репозитория)
#
# Запуск основного стека (10 микросервисов + инфраструктура):
#   docker compose up -d --build
#
# Запуск с демо monitoring_service (SigNoz tutorial, НЕ production):
#   docker compose --profile monitoring up -d --build
#
# Остановка:
#   docker compose down
#
# Production (по docs/specifications/deployment.md и gateway_service/docker-compose.yml):
#   - Точка входа: gateway_service (GATEWAY_MODE=real, :8080)
#   - Отдельные контейнеры, сеть dmz/internal/data
#   - analyse (:8089) — заморожен, не включён
#   - monitoring_service — только demo/observability tutorial, не PKB prod
#   - Embeddings: внешний routerai.ru (qwen/qwen3-embedding-8b)
#   - Reranker: Infinity локально (onnx-community/bge-reranker-v2-m3-ONNX, optimum int8)
#
# Порядок запуска (depends_on):
#
#   [1] postgres, redis, minio → infinity
#         │
#   [2] db-init, minio-init  (one-shot)
#         │
#   [3] auth, registry, parser, converter-validator
#         │
#   [4] rag-builder, rag-search  (→ postgres + infinity)
#         │
#   [5] query  (→ postgres + registry + rag-search)
#         │
#   [6] orchestrator  (→ postgres + redis + minio + parser + converter + registry + rag-*)
#         │
#   [7] gateway  (→ auth + backend-сервисы, без integration)
#         │
#   [8] frontend  (→ gateway)
#
# Порты сервисов (внутри сети = снаружи):
#   frontend :3300  gateway :8080   auth :8082        orchestrator :8081   query :8083
#   registry :8084  converter-validator :8086  parser :8087
#   rag-builder :8090  rag-search :8091   infinity :18580 (host)
# =============================================================================

name: pkb

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# --- Общие переменные БД ---
x-env-db: &env-db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: pkb
  DB_PASSWORD: pkb
  DB_SUPERUSER: pkb
  DB_DATABASE: pkb_neuro
  DATABASE_URL: postgresql+asyncpg://pkb:pkb@postgres:5432/pkb_neuro

# --- MinIO ---
x-env-minio: &env-minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: documents
  MINIO_IMAGE_BUCKET: images
  MINIO_SECURE: "false"

# --- JWT / admin ---
x-env-auth: &env-auth
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pkb-neuroassistant-jwt-secret-key-2026-dev}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin1234!}

# --- Embeddings ---
# Единая переменная: EMBEDDING_BASE_URL. Если не задана — routerai.ru.
# EMBEDDING_API_KEY — опционально, fallback на ROUTERAI_API_KEY.
x-env-embeddings: &env-embeddings
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://routerai.ru/api/v1}
  EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://routerai.ru/api/v1/embeddings}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
  EMBEDDING_DIM: "${EMBEDDING_DIM:-2048}"
  VECTOR_DIMENSION: "${VECTOR_DIMENSION:-${EMBEDDING_DIM:-2048}}"
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${ROUTERAI_API_KEY:-}}
  EMBEDDING_INSTRUCTION: ""

# --- Reranker (Infinity локально) ---
x-env-rerank: &env-rerank
  RERANKER_BASE_URL: http://infinity:7997
  RERANKER_MODEL: onnx-community/bge-reranker-v2-m3-ONNX
  RERANKER_TIMEOUT: "15"
  RERANK_TOP_N: "10"

# --- Межсервисные URL (Docker DNS) ---
x-env-service-urls: &env-service-urls
  AUTH_SERVICE_URL: http://auth:8082
  ORCHESTRATOR_SERVICE_URL: http://orchestrator:8081
  QUERY_SERVICE_URL: http://query:8083
  REGISTRY_SERVICE_URL: http://registry:8084
  CONVERTER_VALIDATOR_SERVICE_URL: http://converter-validator:8086
  CONVERTER_SERVICE_URL: http://converter-validator:8086
  VALIDATE_SERVICE_URL: http://converter-validator:8086
  PARSER_SERVICE_URL: http://parser:8087
  OCR_SERVICE_URL: http://parser:8087
  RAG_BUILDER_SERVICE_URL: http://rag-builder:8090
  RAG_SEARCH_SERVICE_URL: http://rag-search:8091

services:

  # ===========================================================================
  # L4: Инфраструктура
  # ===========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: always
    container_name: pkb-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_USER: pkb
      POSTGRES_PASSWORD: pkb
      POSTGRES_DB: pkb_neuro
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkb -d pkb_neuro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pkb-net
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: pkb-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pkb-net
    logging: *default-logging

  minio:
    # Не понижать версию: volume minio_data несовместим со старыми релизами
    # (ошибка «Unknown xl meta version 3»). При смене major — удалить volume:
    #   docker compose down && docker volume rm pkb_minio_data
    image: minio/minio:latest
    container_name: pkb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pkb-net
    logging: *default-logging

  infinity:
    image: michaelf34/infinity:latest-cpu
    container_name: pkb-infinity
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 0
    volumes:
      - huggingface_cache:/app/.cache
    command:
      - "v2"
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--engine"
      - "torch"
      - "--device"
      - "cpu"
      - "--batch-size"
      - "5"
    ports:
      - "${INFINITY_PORT:-18580}:7997"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - pkb-net
    logging: *default-logging

  # ===========================================================================
  # Init jobs (one-shot)
  # ===========================================================================

  db-init:
    build:
      context: ./backend/service_checker/docker
      dockerfile: Dockerfile.init
    image: pkb/db-init:local
    container_name: pkb-db-init
    environment:
      <<: [*env-db]
    volumes:
      - ./backend:/app/backend
    entrypoint:
      - /bin/bash
      - -c
      - |-
        sed -i 's/\r$//' /app/backend/service_checker/core/setup_db.py 2>/dev/null || true;
        python /app/backend/service_checker/core/setup_db.py --docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pkb-net
    restart: "no"
    logging: *default-logging

  minio-init:
    build:
      context: ./backend/service_checker/docker
      dockerfile: Dockerfile.init
    image: pkb/minio-init:local
    container_name: pkb-minio-init
    environment:
      <<: [*env-minio]
    volumes:
      - ./backend:/app/backend
    entrypoint: ["python", "/app/backend/service_checker/docker/init_minio.py"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pkb-net
    restart: "no"
    logging: *default-logging

  # ===========================================================================
  # L3: Микросервисы (production stack)
  # ===========================================================================

  auth:
    build:
      context: ./backend/auth_service
      dockerfile: Dockerfile
    image: pkb/auth:local
    container_name: pkb-auth
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./backend/auth_service/app:/app/app
      - ./backend/auth_service/telemetry_lib:/app/telemetry_lib
    environment:
      <<: [*env-db, *env-auth]
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://pkb:pkb@postgres:5432/pkb_neuro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8082"]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pkb-net
    logging: *default-logging

  registry:
    build:
      context: ./backend/registry_service
      dockerfile: Dockerfile
    image: pkb/registry:local
    container_name: pkb-registry
    restart: unless-stopped
    ports:
      - "8084:8084"
    volumes:
      - ./backend/registry_service/api:/app/api
      - ./backend/registry_service/services:/app/services
    environment:
      <<: [*env-db]
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://pkb:pkb@postgres:5432/pkb_neuro
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pkb-net
    logging: *default-logging

  docling-service-cpu:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: docling-serve-cpu
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      DOCLING_SERVE_ENABLE_UI: "true"
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      DOCLING_NUM_THREADS: 4
      UVICORN_WORKERS: 1
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "4"
      ONNXRUNTIME_INTRAP_NUM_THREADS: 4
      ONNXRUNTIME_INTERAP_NUM_THREADS: 4
    volumes:
      - docling_hf_cache:/root/.cache/huggingface
    networks:
      - pkb-net
    logging: *default-logging

  parser:
    build:
      context: ./backend/parser_service
      dockerfile: Dockerfile
    image: pkb/parser:local
    container_name: pkb-parser
    restart: unless-stopped
    ports:
      - "8087:8087"
    volumes:
      - ./backend/parser_service/app:/app/app
    develop:
      watch:
        - action: sync
          path: ./backend/parser_service/app
          target: /app/app
          ignore:
            - __pycache__/
    command: uvicorn app.main:app --host 0.0.0.0 --port 8087 --reload
    environment:
      <<: [*env-minio]
      LOG_LEVEL: DEBUG
      DOCLING_SERVE_URL: http://docling-service-cpu:5001
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      docling-service-cpu:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/api/v1/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pkb-net
    logging: *default-logging

  converter-validator:
    build:
      context: ./backend/converter_validator_service
      dockerfile: Dockerfile
    image: pkb/converter-validator:local
    container_name: pkb-converter-validator
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./backend/converter_validator_service/app:/app/app
    environment:
      LOG_LEVEL: DEBUG
      OPENAI_API_KEY: ${ROUTERAI_API_KEY:-}
      OPENAI_BASE_URL: ${LLM_API_BASE_URL:-https://routerai.ru/api/v1}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-deepseek/deepseek-v4-flash}
      DEFAULT_LLM_MAX_TOKENS: "4096"
      DEFAULT_LLM_TIMEOUT: "60"
      CONFIDENCE_THRESHOLD: "0.55"
      REGISTRY_SERVICE_URL: http://registry:8084
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pkb-net
    logging: *default-logging

  rag-builder:
    build:
      context: ./backend/rag_builder_service
      dockerfile: Dockerfile
    image: pkb/rag-builder:local
    container_name: pkb-rag-builder
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./backend/rag_builder_service/src:/app/src
    environment:
      <<: [*env-db, *env-embeddings, *env-rerank]
      LOG_LEVEL: DEBUG
      APP_PORT: "8090"
      CHUNK_SIZE: "1024"
      EMBEDDING_BATCH_SIZE: "256"
      EMBEDDING_RETRIES: "3"
      EMBEDDING_TIMEOUT: "120"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      infinity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/v1/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - pkb-net
    logging: *default-logging

  rag-search:
    build:
      context: ./backend/rag_search_service
      dockerfile: Dockerfile
    image: pkb/rag-search:local
    container_name: pkb-rag-search
    restart: unless-stopped
    ports:
      - "8091:8091"
    volumes:
      - ./backend/rag_search_service/app:/app/app
    environment:
          <<: [*env-db, *env-embeddings, *env-rerank]
          LOG_LEVEL: DEBUG
          # Таймаут 10с — эмбеддинг один и мелкий, долгого ожидания быть не может, сразу retry.
          EMBEDDING_TIMEOUT: "10"
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          POSTGRES_USER: pkb
          POSTGRES_PASSWORD: pkb
          POSTGRES_DB: pkb_neuro
          SEARCH_STRATEGY: dense_rerank
          SEARCH_TOP_K: "10"
          CONTEXT_EXPANSION: "2"
          # Множитель: top_k * fetch_multiplier = 10*2 = 20 кандидатов на rerank
          RERANKER_FETCH_MULTIPLIER: "2"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      infinity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8091/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pkb-net
    logging: *default-logging

  query:
    build:
      context: ./backend/query_service
      dockerfile: Dockerfile
    image: pkb/query:local
    container_name: pkb-query
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./backend/query_service/app:/app/app
    environment:
      <<: [*env-db, *env-service-urls]
      LOG_LEVEL: DEBUG
      DEV_AUTH_MODE: ${DEV_AUTH_MODE:-true}
      RAG_SERVICE_URL: http://rag-search:8091
      MOCK_RAG_ENABLED: ${MOCK_RAG_ENABLED:-false}
      MOCK_REGISTRY_ENABLED: ${MOCK_REGISTRY_ENABLED:-false}
      MOCK_LLM_ENABLED: ${MOCK_LLM_ENABLED:-false}
      LLM_API_URL: ${LLM_API_BASE_URL:-https://routerai.ru/api/v1}
      LLM_API_KEY: ${ROUTERAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4-flash}
      LLM_TEMPERATURE: "0.2"
      LLM_MAX_TOKENS: "8196"
      LLM_TOP_P: "0.95"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
      rag-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/api/v1/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pkb-net
    logging: *default-logging

  orchestrator:
    build:
      context: ./backend/orchestrator_service
      dockerfile: Dockerfile
    image: pkb/orchestrator:local
    container_name: pkb-orchestrator
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./backend/orchestrator_service/app:/app/app
    develop:
      watch:
        - action: sync
          path: ./backend/orchestrator_service/app
          target: /app/app
          ignore:
            - __pycache__/
    environment:
      <<: [*env-db, *env-minio, *env-auth, *env-service-urls]
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REGISTRY_SERVICE_URL: http://registry:8084
      PARSER_SERVICE_URL: http://parser:8087
      OCR_SERVICE_URL: http://parser:8087
      OCR_ENABLED: "false"
      PARSER_FALLBACK_TO_OCR: "false"
      CONVERTER_SERVICE_URL: http://converter-validator:8086
      PIPELINE__AUTO_APPROVE_ENABLED: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8081 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
      converter-validator:
        condition: service_healthy
      registry:
        condition: service_healthy
      rag-builder:
        condition: service_healthy
      rag-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/system/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pkb-net
    logging: *default-logging

  # ===========================================================================
  # celery-worker — Celery worker для пайплайна оркестратора
  # ===========================================================================
  celery-worker:
    build:
      context: ./backend/orchestrator_service
      dockerfile: Dockerfile
    image: pkb/orchestrator:local
    container_name: pkb-celery-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend/orchestrator_service/app:/app/app
    develop:
      watch:
        - action: sync
          path: ./backend/orchestrator_service/app
          target: /app/app
          ignore:
            - __pycache__/
    command: celery -A app.celery_app worker --loglevel=debug --concurrency=4 --pool=threads -Q celery,pipeline,saga
    healthcheck:
      disable: true
    environment:
      <<: [*env-db, *env-service-urls]
      LOG_LEVEL: DEBUG
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REGISTRY_SERVICE_URL: http://registry:8084
      OCR_ENABLED: "false"
      PARSER_FALLBACK_TO_OCR: "false"
      PIPELINE__AUTO_APPROVE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
    networks:
      - pkb-net
    logging: *default-logging

  gateway:
    build:
      context: ./backend/gateway_service
      dockerfile: Dockerfile
    image: pkb/gateway:local
    container_name: pkb-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    privileged: true
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/project:ro
      - /proc:/host/proc:ro
      - ./backend/gateway_service/gateway:/app/gateway
    environment:
      <<: [*env-service-urls]
      GATEWAY_LOG_LEVEL: "DEBUG"
      GATEWAY_MODE: real
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8080"
      ENV: ${ENV:-development}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-0}
      GATEWAY_REQUEST_TIMEOUT: "300"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      PROJECT_DIR: /project
      HOST_PROC: /host/proc
    depends_on:
      auth:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      query:
        condition: service_healthy
      registry:
        condition: service_healthy
      converter-validator:
        condition: service_healthy
      parser:
        condition: service_healthy
      rag-builder:
        condition: service_healthy
      rag-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pkb-net
    logging: *default-logging

  # ===========================================================================
  # frontend — React SPA (nginx)
  # ===========================================================================

  frontend:
    build:
      context: "./UI-UX/UI Final/frontend"
      dockerfile: Dockerfile
    image: pkb-rag-frontend:latest
    container_name: pkb-frontend
    restart: unless-stopped
    ports:
      - "3300:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
      VITE_GATEWAY_AUTO_LOGIN: ${VITE_GATEWAY_AUTO_LOGIN:-false}
      VITE_GATEWAY_USERNAME: ${VITE_GATEWAY_USERNAME:-}
      VITE_GATEWAY_PASSWORD: ${VITE_GATEWAY_PASSWORD:-}
    develop:
      watch:
        - path: "./UI-UX/UI Final/frontend/src"
          action: rebuild
        - path: "./UI-UX/UI Final/frontend/package.json"
          action: rebuild
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - pkb-net
    logging: *default-logging

  # ===========================================================================
  # monitoring_service — НЕ production PKB, demo для SigNoz/OpenTelemetry
  # Запуск: docker compose --profile monitoring up -d
  # Требует внешнюю сеть signoz-net (SigNoz stack)
  # ===========================================================================

  monitoring-service-a:
    profiles: [monitoring]
    build:
      context: ./backend/monitoring_service/services
      dockerfile: service_a/Dockerfile
    container_name: pkb-monitoring-a
    ports:
      - "8100:8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-signoz-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    networks:
      - pkb-net
      - signoz-net
    logging: *default-logging

  monitoring-service-b:
    profiles: [monitoring]
    build:
      context: ./backend/monitoring_service/services
      dockerfile: service_b/Dockerfile
    container_name: pkb-monitoring-b
    ports:
      - "8101:8001"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-signoz-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    networks:
      - pkb-net
      - signoz-net
    logging: *default-logging

  monitoring-service-c:
    profiles: [monitoring]
    build:
      context: ./backend/monitoring_service/services
      dockerfile: service_c/Dockerfile
    container_name: pkb-monitoring-c
    ports:
      - "8102:8002"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-signoz-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      SERVICE_A_URL: http://monitoring-service-a:8000
      SERVICE_B_URL: http://monitoring-service-b:8001
    depends_on:
      - monitoring-service-a
      - monitoring-service-b
    networks:
      - pkb-net
      - signoz-net
    logging: *default-logging

networks:
  pkb-net:
    driver: bridge
  signoz-net:
    external: true
    name: signoz-net

volumes:
  pg_data:
  minio_data:
  huggingface_cache:
  docling_hf_cache:
